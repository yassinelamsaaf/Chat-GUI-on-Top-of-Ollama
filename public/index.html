
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ollama Chat</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <header class="header">

            <div>
                <h1>Local AI Chat</h1>
                <p>Powered by Ollama</p>
            </div>

            <button id="new-chat">
                New Chat
            </button>

        </header>

        <section class="toolbar">

            <div class="model-control">

                <label for="model-select">
                    Model
                </label>

                <select id="model-select">
                    <option>Loading models...</option>
                </select>

            </div>

            <label
                id="think-control"
                class="think-control"
                hidden
            >
                <input
                    type="checkbox"
                    id="think-toggle"
                >

                Enable reasoning
            </label>

            <div class="advanced-controls">

                <label for="system-prompt">
                    System prompt
                </label>

                <textarea
                    id="system-prompt"
                    rows="2"
                    placeholder="Define your AI assistant's behaviour..."
                ></textarea>

                <label for="temperature">
                    Temperature:
                    <span id="temperature-value">0.7</span>
                </label>

                <input
                    type="range"
                    id="temperature"
                    min="0"
                    max="1"
                    step="0.1"
                    value="0.7"
                >

                <label for="num-ctx">
                    Context size:
                    <span id="num-ctx-value">2048</span>
                    <small>(larger values use more memory)</small>
                </label>

                <input
                    type="range"
                    id="num-ctx"
                    min="512"
                    max="8192"
                    step="512"
                    value="2048"
                >

            </div>

        </section>

        <main id="messages" class="messages">

            <div class="welcome">
                <h2>Welcome!</h2>

                <p>
                    Ask your local AI assistant anything.
                </p>
            </div>

        </main>

        <div id="status" class="status"></div>

        <form id="chat-form" class="chat-form">

            <div id="image-control" class="image-control" hidden>
                <label for="image-input">Attach an image (vision model, max 3 MB)</label>
                <input
                    type="file"
                    id="image-input"
                    accept="image/*"
                >
                <span id="image-status" aria-live="polite"></span>
            </div>

            <textarea
                id="message-input"
                placeholder="Type your message..."
                rows="2"
            ></textarea>

            <div class="actions">

                <button
                    type="button"
                    id="stop-button"
                    disabled
                >
                    Stop
                </button>

                <button
                    type="submit"
                    id="send-button"
                >
                    Send
                </button>

            </div>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
